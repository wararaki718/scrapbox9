services:
  elasticsearch:
    image: custom-score-elasticsearch:${ELASTICSEARCH_VERSION}
    build:
      context: .
      args:
        ELASTICSEARCH_VERSION: ${ELASTICSEARCH_VERSION}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  elasticsearch-data: